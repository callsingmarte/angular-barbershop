<section>
  <div class="hero">
    <img class="barber-img" [src]="barberProfile.barberProfilePic.src" [alt]="barberProfile.barberProfilePic.alt">
    <article>
      <app-barber-frame [image]="barberProfile.barberProfilePic" [name]="barberProfile.barberName" />
      <div class="col barber-description-container">
        <div class="barber-description">
          <p>
            {{barberProfile.barberDescription}}
          </p>
        </div>
        <app-barber-services [barberServices]="barberProfile.barberServices" />
      </div>
    </article>
    <app-image-gallery [images]="barberProfile.barberGallery" />
  </div>
</section>
